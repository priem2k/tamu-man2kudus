name: Auto Build & Deploy Siapa Tamu Hari Ini - MAN 2 Kudus

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Berjalan otomatis setiap pagi pukul 06:00 WIB (23:00 UTC)
    - cron: '0 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Web App Siapa Tamu Hari Ini MAN 2 Kudus
        run: python generate_tamu_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
